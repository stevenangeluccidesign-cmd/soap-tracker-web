<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EVS Soap Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .box {
            margin-top: 25px;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 12px;
        }

        .label {
            font-size: 18px;
            font-weight: bold;
        }

        .value {
            font-size: 26px;
            margin-top: 8px;
            margin-bottom: 25px;
        }

        #status {
            margin-top: 25px;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            background: #c8f7c5;
        }
    </style>
</head>

<body>

<h1>EVS Soap Tracker</h1>

<div class="box">

    <div class="label">Soap ID:</div>
    <div class="value" id="soapId"></div>

    <div class="label">This soap belongs in:</div>
    <div class="value" id="assignedLocation"></div>

</div>

<div id="status">
    QR CODE IDENTIFIED
</div>

<script>

const soapLocations = {
    "SOAP-001": "1 West Men's Restroom",
    "SOAP-002": "1 West Women's Restroom",
    "SOAP-003": "1 East Men's Restroom"
};

const params = new URLSearchParams(window.location.search);

const soapId = params.get("soap");

const soapIdDisplay = document.getElementById("soapId");
const assignedLocationDisplay = document.getElementById("assignedLocation");
const status = document.getElementById("status");

if (soapId && soapLocations[soapId]) {

    soapIdDisplay.textContent = soapId;
    assignedLocationDisplay.textContent = soapLocations[soapId];

    status.textContent = "✅ SOAP IDENTIFIED";

} else {

    soapIdDisplay.textContent = "UNKNOWN";
    assignedLocationDisplay.textContent = "Scan a valid soap QR code";

    status.textContent = "❌ INVALID QR CODE";
    status.style.background = "#ffcccc";
}

</script>

</body>
</html>
