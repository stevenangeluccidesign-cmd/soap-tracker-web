<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVS Soap Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .box {
            border: 2px solid #ccc;
            border-radius: 12px;
            padding: 20px;
        }

        .label {
            font-size: 18px;
            font-weight: bold;
        }

        .value {
            font-size: 26px;
            margin: 8px 0 25px;
        }

        #status {
            margin-top: 25px;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            border-radius: 10px;
        }

        .correct {
            background: #c8f7c5;
        }

        .wrong {
            background: #ffcccc;
        }

        .waiting {
            background: #fff3cd;
        }

        #animationArea {
            height: 150px;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }

        .boot {
            position: absolute;
            left: 40px;
            bottom: 20px;
            font-size: 70px;
            animation: kickBoot 1s ease-in-out forwards;
        }

        .soap {
            position: absolute;
            left: 150px;
            bottom: 35px;
            font-size: 60px;
            animation: soapFly 1s ease-in-out forwards;
        }

        @keyframes kickBoot {
            0% { transform: translateX(0); }
            50% { transform: translateX(75px) rotate(-25deg); }
            100% { transform: translateX(0); }
        }

        @keyframes soapFly {
            0% {
                transform: translateX(0);
                opacity: 1;
            }

            50% {
                transform: translateX(0);
                opacity: 1;
            }

            100% {
                transform: translateX(280px) translateY(-40px) rotate(60deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

<h1>EVS Soap Tracker</h1>

<div class="box">

    <div class="label">Soap ID:</div>
    <div class="value" id="soapId"></div>

    <div class="label">This soap belongs in:</div>
    <div class="value" id="assignedLocation"></div>

    <div class="label">Current scanned area:</div>
    <div class="value" id="currentLocation"></div>

</div>

<div id="status"></div>

<div id="animationArea"></div>

<script>
const soapLocations = {
    "SOAP-001": "1-west-men",
    "SOAP-002": "1-west-women",
    "SOAP-003": "1-east-men"
};

const locationNames = {
    "1-west-men": "1 West Men's Restroom",
    "1-west-women": "1 West Women's Restroom",
    "1-east-men": "1 East Men's Restroom"
};

const params = new URLSearchParams(window.location.search);

const soapId = params.get("soap");
const currentLocation = params.get("location");
const assignedLocation = soapLocations[soapId];

const soapDisplay = document.getElementById("soapId");
const assignedDisplay = document.getElementById("assignedLocation");
const currentDisplay = document.getElementById("currentLocation");
const status = document.getElementById("status");
const animationArea = document.getElementById("animationArea");

if (!soapId || !assignedLocation) {

    soapDisplay.textContent = "UNKNOWN";
    assignedDisplay.textContent = "Soap not found";
    currentDisplay.textContent = "Unknown";

    status.textContent = "❌ INVALID SOAP QR";
    status.className = "wrong";

} else {

    soapDisplay.textContent = soapId;
    assignedDisplay.textContent = locationNames[assignedLocation];

    if (!currentLocation) {

        currentDisplay.textContent = "Location not scanned";

        status.textContent =
            "⚠️ SOAP IDENTIFIED — LOCATION NOT VERIFIED";

        status.className = "waiting";

        animationArea.innerHTML = `
            <div class="boot">🥾</div>
            <div class="soap">🧼</div>
        `;

    } else {

        currentDisplay.textContent =
            locationNames[currentLocation] || currentLocation;

        if (currentLocation === assignedLocation) {

            status.textContent = "✅ CORRECT AREA";
            status.className = "correct";
            animationArea.innerHTML = "";

        } else {

            status.textContent = "🚨 WRONG AREA — MOVE THIS SOAP!";
            status.className = "wrong";

            animationArea.innerHTML = `
                <div class="boot">🥾</div>
                <div class="soap">🧼</div>
            `;
        }
    }
}
</script>

</body>
</html>
